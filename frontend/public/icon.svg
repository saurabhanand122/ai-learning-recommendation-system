<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Theme Primary Gradient -->
    <linearGradient id="themeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- AI Path Network Lines (Glow background) -->
  <g opacity="0.35" stroke="url(#themeGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="256" x2="256" y2="160" />
    <line x1="256" y1="160" x2="392" y2="256" />
    <line x1="256" y1="160" x2="256" y2="350" />
    <line x1="120" y1="256" x2="256" y2="350" />
    <line x1="392" y1="256" x2="256" y2="350" />
    <line x1="120" y1="256" x2="80" y2="320" />
    <line x1="392" y1="256" x2="432" y2="320" />
  </g>

  <!-- Network Nodes (Circles) -->
  <g opacity="0.5">
    <circle cx="120" cy="256" r="8" fill="#3b82f6" />
    <circle cx="392" cy="256" r="8" fill="#ec4899" />
    <circle cx="256" cy="160" r="10" fill="#8b5cf6" />
    <circle cx="256" cy="350" r="8" fill="#06b6d4" />
    <circle cx="80" cy="320" r="6" fill="#3b82f6" />
    <circle cx="432" cy="320" r="6" fill="#ec4899" />
  </g>

  <!-- Outer Glowing Rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#themeGrad)" stroke-width="4" stroke-dasharray="15 10 5 10" filter="url(#glow)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="4 8" opacity="0.6" />

  <!-- Main Cap Branding Emblem -->
  <g filter="url(#glow)" transform="translate(136, 156)">
    <!-- Cap Base Shadow/Glow -->
    <path d="M 120,40 L 220,95 L 120,150 L 20,95 Z" fill="url(#themeGrad)" />
    
    <!-- Cap Top Diamond -->
    <polygon points="120,30 230,85 120,140 10,85" fill="#0a0a0f" stroke="url(#themeGrad)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Cap Skull Base -->
    <path d="M 60,98 L 60,140 C 60,165 180,165 180,140 L 180,98" fill="none" stroke="url(#themeGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Tassel String -->
    <path d="M 120,85 L 60,110 L 45,150" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Tassel Fringe -->
    <polygon points="40,150 50,150 45,170" fill="#ec4899" />
    
    <!-- Center Core Sparkle -->
    <circle cx="120" cy="85" r="7" fill="#ffffff" />
    <path d="M 120,70 L 120,100 M 105,85 L 135,85" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
